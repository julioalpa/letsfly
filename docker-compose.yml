services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: buscador
      POSTGRES_USER: buscador
      POSTGRES_PASSWORD: ${DB_PASSWORD:-buscador}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buscador -d buscador"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: buscador
      DB_USER: buscador
      DB_PASSWORD: ${DB_PASSWORD:-buscador}
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
